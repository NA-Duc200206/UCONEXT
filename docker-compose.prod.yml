# Production / Staging deployment manifest pulling pre-built images from GHCR.
# Uses managed MongoDB Atlas (MONGODB_URI) and managed Redis TLS (REDIS_URL).
# Rollback: update IMAGE_TAG in .env to a previous sha tag and run:
#   docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d --wait

services:
  backend:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/uconext-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    expose:
      - "5000"
    volumes:
      - uconext_uploads:/app/backend/public/uploads
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      APP_VERSION: ${IMAGE_TAG}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-2}
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  frontend:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/uconext-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_BIND_IP:-127.0.0.1}:${FRONTEND_PORT:-3000}:8080"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health | grep -q '\"status\":\"ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s

volumes:
  uconext_uploads:
