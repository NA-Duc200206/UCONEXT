name: Deploy

on:
  push:
    branches: [dev]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: 'Optional existing image tag to deploy (defaults to current sha)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}
      image_registry: ${{ steps.meta.outputs.registry_prefix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image metadata
        id: meta
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHA_TAG="sha-${GITHUB_SHA::12}"
          echo "registry_prefix=${REGISTRY}/${OWNER_LOWER}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "release_tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.registry_prefix }}/uconext-backend:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.release_tag && format('{0}/uconext-backend:{1}', steps.meta.outputs.registry_prefix, steps.meta.outputs.release_tag) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          build-args: |
            VITE_FIREBASE_API_KEY=${{ vars.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ vars.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_APP_ID=${{ vars.VITE_FIREBASE_APP_ID }}
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
            VITE_SENTRY_ENVIRONMENT=${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
          tags: |
            ${{ steps.meta.outputs.registry_prefix }}/uconext-frontend:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.release_tag && format('{0}/uconext-frontend:{1}', steps.meta.outputs.registry_prefix, steps.meta.outputs.release_tag) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.ref == 'refs/heads/dev' || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')
    environment:
      name: staging
      url: https://staging.uconext.vn
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy and verify with automatic rollback
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/uconext' }}
          HEALTH_URL: ${{ vars.HEALTH_URL || 'https://staging.uconext.vn/api/health' }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REGISTRY: ${{ needs.build-and-push.outputs.image_registry }}
          NEW_TAG: ${{ inputs.image_tag || needs.build-and-push.outputs.image_tag }}
        run: |
          install -m 600 /dev/null /tmp/deploy_key
          printf '%s\n' "$SSH_KEY" > /tmp/deploy_key
          scp -i /tmp/deploy_key -P "$SSH_PORT" -o StrictHostKeyChecking=accept-new \
            docker-compose.prod.yml "${SSH_USER}@${SSH_HOST}:${DEPLOY_DIR}/docker-compose.prod.yml"
          ssh -i /tmp/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new "${SSH_USER}@${SSH_HOST}" \
            "IMAGE_REGISTRY='${IMAGE_REGISTRY}' NEW_TAG='${NEW_TAG}' DEPLOY_DIR='${DEPLOY_DIR}' HEALTH_URL='${HEALTH_URL}' GHCR_USERNAME='${GHCR_USERNAME}' GHCR_TOKEN='${GHCR_TOKEN}' bash -s" <<'EOF'
          set -euo pipefail
          cd "$DEPLOY_DIR"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

          PREV_TAG=$(grep -E '^IMAGE_TAG=' .env | tail -n1 | cut -d'=' -f2- || true)

          update_env() {
            local key="$1"
            local val="$2"
            if grep -qE "^${key}=" .env; then
              sed -i "s|^${key}=.*|${key}=${val}|" .env
            else
              printf '\n%s=%s\n' "$key" "$val" >> .env
            fi
          }

          update_env "IMAGE_REGISTRY" "$IMAGE_REGISTRY"
          update_env "IMAGE_TAG" "$NEW_TAG"

          docker compose -f docker-compose.prod.yml pull
          if ! docker compose -f docker-compose.prod.yml up -d --wait; then
            echo "Container startup failed; initiating rollback to ${PREV_TAG:-none}"
            if [ -n "$PREV_TAG" ]; then
              update_env "IMAGE_TAG" "$PREV_TAG"
              docker compose -f docker-compose.prod.yml pull
              docker compose -f docker-compose.prod.yml up -d --wait
            fi
            exit 1
          fi

          if ! curl -fsS --retry 5 --retry-delay 3 "$HEALTH_URL" | grep -q '"status":"ok"'; then
            echo "Health smoke check failed on ${HEALTH_URL}; rolling back to ${PREV_TAG:-none}"
            if [ -n "$PREV_TAG" ]; then
              update_env "IMAGE_TAG" "$PREV_TAG"
              docker compose -f docker-compose.prod.yml pull
              docker compose -f docker-compose.prod.yml up -d --wait
            fi
            exit 1
          fi
          echo "Successfully deployed ${NEW_TAG} and verified ${HEALTH_URL}"
          EOF
          rm -f /tmp/deploy_key

  deploy-production:
    name: Deploy to Production (Approval Required)
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
    environment:
      name: production
      url: https://uconext.vn
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy and verify with automatic rollback
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/uconext' }}
          HEALTH_URL: ${{ vars.HEALTH_URL || 'https://uconext.vn/api/health' }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REGISTRY: ${{ needs.build-and-push.outputs.image_registry }}
          NEW_TAG: ${{ inputs.image_tag || needs.build-and-push.outputs.image_tag }}
        run: |
          install -m 600 /dev/null /tmp/deploy_key
          printf '%s\n' "$SSH_KEY" > /tmp/deploy_key
          scp -i /tmp/deploy_key -P "$SSH_PORT" -o StrictHostKeyChecking=accept-new \
            docker-compose.prod.yml "${SSH_USER}@${SSH_HOST}:${DEPLOY_DIR}/docker-compose.prod.yml"
          ssh -i /tmp/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new "${SSH_USER}@${SSH_HOST}" \
            "IMAGE_REGISTRY='${IMAGE_REGISTRY}' NEW_TAG='${NEW_TAG}' DEPLOY_DIR='${DEPLOY_DIR}' HEALTH_URL='${HEALTH_URL}' GHCR_USERNAME='${GHCR_USERNAME}' GHCR_TOKEN='${GHCR_TOKEN}' bash -s" <<'EOF'
          set -euo pipefail
          cd "$DEPLOY_DIR"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

          PREV_TAG=$(grep -E '^IMAGE_TAG=' .env | tail -n1 | cut -d'=' -f2- || true)

          update_env() {
            local key="$1"
            local val="$2"
            if grep -qE "^${key}=" .env; then
              sed -i "s|^${key}=.*|${key}=${val}|" .env
            else
              printf '\n%s=%s\n' "$key" "$val" >> .env
            fi
          }

          update_env "IMAGE_REGISTRY" "$IMAGE_REGISTRY"
          update_env "IMAGE_TAG" "$NEW_TAG"

          docker compose -f docker-compose.prod.yml pull
          if ! docker compose -f docker-compose.prod.yml up -d --wait; then
            echo "Container startup failed; initiating rollback to ${PREV_TAG:-none}"
            if [ -n "$PREV_TAG" ]; then
              update_env "IMAGE_TAG" "$PREV_TAG"
              docker compose -f docker-compose.prod.yml pull
              docker compose -f docker-compose.prod.yml up -d --wait
            fi
            exit 1
          fi

          if ! curl -fsS --retry 5 --retry-delay 3 "$HEALTH_URL" | grep -q '"status":"ok"'; then
            echo "Health smoke check failed on ${HEALTH_URL}; rolling back to ${PREV_TAG:-none}"
            if [ -n "$PREV_TAG" ]; then
              update_env "IMAGE_TAG" "$PREV_TAG"
              docker compose -f docker-compose.prod.yml pull
              docker compose -f docker-compose.prod.yml up -d --wait
            fi
            exit 1
          fi
          echo "Successfully deployed ${NEW_TAG} and verified ${HEALTH_URL}"
          EOF
          rm -f /tmp/deploy_key
