name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Test, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache MongoDB Memory Server binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            mongodb-binaries-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Run backend unit & HTTP integration tests
        run: npm run test:backend

      - name: Typecheck tests & build backend
        run: npm run typecheck:backend

  frontend:
    name: Frontend Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm run test:frontend

      - name: Build frontend
        run: npm run build:frontend

  docker:
    name: Docker build & smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate smoke-test .env from production template
        run: |
          cp .env.production.example .env
          sed -i "s/__GEN__/$(openssl rand -hex 32)/g" .env

      - name: Build and start Docker Compose stack
        run: docker compose up -d --build --wait

      - name: Verify health endpoint through Nginx edge and ensure backend port is not exposed
        run: |
          curl -fsS http://localhost:3000/api/health | grep '"status":"ok"'
          if curl -fsS http://localhost:5000/api/health >/dev/null 2>&1; then
            echo "Backend port 5000 should not be published on host"
            exit 1
          fi

      - name: Dump backend logs on failure
        if: failure()
        run: docker compose logs backend

      - name: Tear down compose stack
        if: always()
        run: docker compose down -v
