name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, Format & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format:check

      - name: Typecheck backend & tests
        run: npm run typecheck:backend

      - name: Typecheck frontend
        run: npm run typecheck:frontend

  backend:
    name: Backend Test & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache MongoDB Memory Server binaries
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            mongodb-binaries-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests with coverage thresholds
        run: npm run test:backend:coverage

  frontend:
    name: Frontend Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run frontend unit & component tests
        run: npm run test:frontend

      - name: Build frontend bundle
        run: npm run build:frontend

  docker:
    name: Docker Build & Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate smoke-test .env from production template
        run: |
          cp .env.production.example .env
          sed -i "s/__GEN__/$(openssl rand -hex 32)/g" .env

      - name: Build and start Docker Compose stack
        run: docker compose up -d --build --wait

      - name: Verify health endpoint, cache headers, and backend port isolation
        run: |
          curl -fsS http://localhost:3000/api/health | grep '"status":"ok"'
          curl -fsSI http://localhost:3000/ | grep -iq 'cache-control:.*no-cache'
          if curl -fsS http://localhost:5000/api/health >/dev/null 2>&1; then
            echo "Backend port 5000 should not be published on host"
            exit 1
          fi

      - name: Dump backend logs on failure
        if: failure()
        run: docker compose logs backend

      - name: Tear down compose stack
        if: always()
        run: docker compose down -v

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [docker]
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Generate E2E .env from production template
        run: |
          cp .env.production.example .env
          sed -i "s/__GEN__/$(openssl rand -hex 32)/g" .env

      - name: Build and start Docker Compose stack
        run: docker compose up -d --build --wait

      - name: Seed database for E2E flows
        run: |
          docker compose exec -T \
            -e ALLOW_PROD_SEED=true \
            -e SEED_ADMIN_EMAIL=admin@uconext.local \
            -e SEED_ADMIN_PASSWORD=AdminStrongPass123! \
            backend npm run seed

      - name: Run Playwright E2E suite
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_ADMIN_EMAIL: admin@uconext.local
          E2E_ADMIN_PASSWORD: AdminStrongPass123!
        run: npm run test:e2e

      - name: Dump backend logs on failure
        if: failure()
        run: docker compose logs backend

      - name: Tear down compose stack
        if: always()
        run: docker compose down -v

  audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Audit production dependencies (high+)
        run: npm audit --audit-level=high --omit=dev
